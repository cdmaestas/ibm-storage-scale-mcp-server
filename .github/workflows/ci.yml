name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Run tests
        run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@latest validate extension/manifest.json

      - name: Check manifest version matches the package
        run: |
          python3 - <<'PY'
          import json, sys, tomllib
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          man = json.load(open("extension/manifest.json"))["version"]
          if pkg != man:
              sys.exit(f"version mismatch: pyproject {pkg} != manifest {man}")
          print("versions match:", pkg)
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ibm-storage-scale-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - server starts and serves MCP over HTTP
        run: |
          docker run -d --name scale-mcp -p 8000:8000 \
            -e SCALE_API_HOSTNAME=dummy ibm-storage-scale-mcp-server:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 1 http://127.0.0.1:8000/mcp || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          resp=$(curl -s --max-time 5 -X POST http://127.0.0.1:8000/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          echo "$resp"
          docker logs scale-mcp || true
          docker rm -f scale-mcp || true
          echo "$resp" | grep -q '"serverInfo"' || { echo "MCP initialize did not return serverInfo" >&2; exit 1; }
