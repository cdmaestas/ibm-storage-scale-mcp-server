name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Run tests
        run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@latest validate extension/manifest.json

      - name: Check manifest version matches the package
        run: |
          python3 - <<'PY'
          import json, sys, tomllib
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          man = json.load(open("extension/manifest.json"))["version"]
          if pkg != man:
              sys.exit(f"version mismatch: pyproject {pkg} != manifest {man}")
          print("versions match:", pkg)
          PY
