name: Publish to PyPI

# Publishes the package when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC) - no API tokens or secrets are stored in the repo. Before
# the first release, configure a trusted publisher on PyPI for this project:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short 2>/dev/null || grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ($tag) does not match pyproject version ($pkg)" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    # Pack the Claude Desktop Extension and attach it to the release so users
    # can download and double-click to install.
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload a release asset
    steps:
      - uses: actions/checkout@v4

      - name: Pack MCPB bundle
        run: npx --yes @anthropic-ai/mcpb@latest pack extension ibm-storage-scale-mcp-server.mcpb

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" ibm-storage-scale-mcp-server.mcpb --clobber

  docker:
    # Build and push the container image to GitHub Container Registry (GHCR).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
