[project]
name = "ibm-storage-scale-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for IBM Storage Scale"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "ibm-storage-scale", "gpfs", "storage", "claude", "llm"]
classifiers = [
 "Development Status :: 4 - Beta",
 "Intended Audience :: System Administrators",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Topic :: System :: Systems Administration",
]
dependencies = [
 "fastmcp>=3.1.0",
 "httpx>=0.27.0",
 "paramiko>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/IBM/ibm-storage-scale-mcp-server"
Repository = "https://github.com/IBM/ibm-storage-scale-mcp-server"
Issues = "https://github.com/IBM/ibm-storage-scale-mcp-server/issues"

[dependency-groups]
dev = [
 "pytest>=8.0.0",
 "pytest-asyncio>=0.25.0",
 "respx>=0.22.0",
 "ruff>=0.8.0",
 "pip-audit>=2.7.0",
 "pre-commit>=4.0.0",
]

[tool.uv]
# Constrain transitive dependencies to versions that resolve known CVEs
# (surfaced by pip-audit). These are not direct dependencies; the bounds only
# steer the resolver away from the vulnerable releases.
constraint-dependencies = [
 "mcp>=1.28.1",       # CVE-2026-52870, CVE-2026-52869, CVE-2026-59950
 "click>=8.3.3",      # PYSEC-2026-2132
]

[build-system]
requires = ["uv_build>=0.10.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is ibm-storage-scale-mcp-server; the import package keeps
# its shorter name.
module-name = "scale_mcp_server"

[project.scripts]
# Both names launch the same server. ibm-storage-scale-mcp-server matches the
# distribution so `uvx ibm-storage-scale-mcp-server` works with no --from.
ibm-storage-scale-mcp-server = "scale_mcp_server:main"
scale-mcp-server = "scale_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
